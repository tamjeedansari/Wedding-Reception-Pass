<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Reception Pass</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Georgia", serif;
    }
    body {
      background: radial-gradient(circle at top, #1a1a24, #0b0c10);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .badge-card {
      background: #14161d;
      width: 100%;
      max-width: 390px;
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      border: 1px solid #c5a059;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(197, 160, 89, 0.15);
      position: relative;
    }
    .status-icon-wrapper {
      width: 86px;
      height: 86px;
      margin: 0 auto 20px;
      background: rgba(197, 160, 89, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #d4af37;
      animation: pulse 2.2s infinite ease-out;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .status-icon {
      font-size: 38px;
      color: #d4af37;
    }
    .welcome-text {
      color: #c5a059;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .names {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .event-type {
      color: #a0a5b5;
      font-size: 15px;
      font-style: italic;
      margin-bottom: 24px;
    }
    .status-pill {
      display: inline-block;
      background: rgba(37, 211, 102, 0.15);
      color: #25d366;
      border: 1px solid rgba(37, 211, 102, 0.4);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .meta-box {
      background: #1d202a;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #2a2e3d;
    }
    .meta-label {
      color: #8c93a8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .clock {
      font-family: monospace;
      color: #d4af37;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .date {
      color: #8c93a8;
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="badge-card">
    <div class="status-icon-wrapper">
      <div class="pulse-ring"></div>
      <div class="status-icon">✦</div>
    </div>

    <p class="welcome-text">Welcome to the</p>
    <div class="event-type">Wedding Reception for</div>
    <h1 class="names">Sultanunnisa<br>&amp;<br>Ausaf</h1>

    <div style="margin-top: 18px;">
      <span class="status-pill">✓ Entry Confirmed</span>
    </div>

    <div class="meta-box">
      <div class="meta-label">Scanned Live Verification</div>
      <div id="live-clock" class="clock">--:--:--</div>
      <div id="live-date" class="date">Loading date...</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent = now.toLocaleTimeString();
      document.getElementById('live-date').textContent = now.toLocaleDateString(undefined, {
        weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
